name: Candidate Email Tenant Index Regression

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/029_recruiting_candidates_tenant_email_uniqueness.sql'
      - 'tests/recruiting-candidates-tenant-email-index-regression.mjs'
      - '.github/workflows/candidate-email-tenant-index-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-email-tenant-index-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run migration contract regression
        run: node tests/recruiting-candidates-tenant-email-index-regression.mjs
