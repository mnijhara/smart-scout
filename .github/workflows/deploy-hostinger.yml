name: Deploy Smart Scout to Hostinger

on:
  workflow_run:
    workflows: ["Build production frontend and server"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact verified production artifact
        uses: actions/download-artifact@v4
        with:
          name: smartscout-production-${{ github.event.workflow_run.head_sha }}
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify bundled production dependencies
        working-directory: release
        run: |
          test -f server.js
          test -f package.json
          test -x node_modules/.bin/esbuild || true
          echo "Using the exact node_modules tree from the verified production artifact"
      - name: Deploy exact verified artifact to Hostinger over SFTP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          source: "release/dist,release/server.js,release/server.cjs,release/package.json,release/node_modules"
          target: ${{ secrets.HOSTINGER_APP_PATH }}
          overwrite: true
      - name: Restart Hostinger Node application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            cd "${{ secrets.HOSTINGER_APP_PATH }}"
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Smart Scout deployed from verified build ${GITHUB_SHA}"
