name: Approval Decision Tenant Audit Regression

on:
  push:
    branches: [main]
    paths:
      - 'services/recruiting/controlPlane.ts'
      - 'tests/approval-decision-tenant-audit-regression.mjs'
      - '.github/workflows/approval-decision-tenant-audit-regression.yml'
  pull_request:
    paths:
      - 'services/recruiting/controlPlane.ts'
      - 'tests/approval-decision-tenant-audit-regression.mjs'
      - '.github/workflows/approval-decision-tenant-audit-regression.yml'

permissions:
  contents: read

jobs:
  approval-audit-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/approval-decision-tenant-audit-regression.mjs
