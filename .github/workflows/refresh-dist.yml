name: Refresh tracked production artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build production server
        run: npx esbuild server.ts --bundle --platform=node --format=esm --outfile=server.js --packages=external

      - name: Verify production server
        run: |
          test -f dist/index.html
          test -f server.js
          test -f server.cjs
          node --check server.js
          node --check server.cjs
          grep -q "workspaceSessionInfo" server.js
          grep -q "requireWorkspaceAuth" server.js

      - name: Commit refreshed production artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist server.js
          if git diff --cached --quiet; then
            echo "production artifacts are already current"
            exit 0
          fi
          git commit -m "build: refresh tracked production artifacts"
          git push
