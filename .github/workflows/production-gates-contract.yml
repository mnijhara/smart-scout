name: SmartScout Production Gate Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smartscout-production-gate-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-gate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production migration gate coverage
        run: node tests/production-gates-migration-contract-regression.mjs
