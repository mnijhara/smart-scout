name: Repair Hiring Lifecycle Type

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Repair candidate role type
        shell: bash
        run: |
          set -euo pipefail
          file='components/HiringLifecycleRelease.tsx'
          grep -q "type Candidate={id?:string;name:string;headline?:string;" "$file"
          grep -q "c.role" "$file"
          python - <<'PY'
          from pathlib import Path
          p = Path('components/HiringLifecycleRelease.tsx')
          s = p.read_text()
          old = "type Candidate={id?:string;name:string;headline?:string;location?:string;"
          new = "type Candidate={id?:string;name:string;role?:string;headline?:string;location?:string;"
          if old not in s:
              raise SystemExit('expected Candidate type contract not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q "type Candidate={id?:string;name:string;role?:string;" "$file"
      - name: Commit source fix and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/HiringLifecycleRelease.tsx
          git rm .github/workflows/repair-hiring-lifecycle-type.yml
          git commit -m 'fix: type hiring lifecycle candidate role'
          git push origin HEAD:main
