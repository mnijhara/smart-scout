name: SmartScout Hiring Lifecycle Migration Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-hiring-lifecycle-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify hiring lifecycle migration chain
        run: node scripts/verify-hiring-lifecycle-migration-chain.mjs
