name: Server Error Handler Regression

on:
  push:
    branches: [main]
    paths:
      - 'server.ts'
      - 'tests/server-error-handler-regression.mjs'
      - '.github/workflows/server-error-handler-regression.yml'
  pull_request:
    paths:
      - 'server.ts'
      - 'tests/server-error-handler-regression.mjs'
      - '.github/workflows/server-error-handler-regression.yml'

permissions:
  contents: read

concurrency:
  group: server-error-handler-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-error-handler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run server error handler regression
        run: node tests/server-error-handler-regression.mjs
