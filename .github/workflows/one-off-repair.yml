name: One-off flow repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch approval flow and demo entry points
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('components/HiringLifecycleV2.tsx')
          s=p.read_text()
          old=""" async function requestJdApproval(){if(!jobId)return;setApprovalBusy(true);setError('');try{const d=await control('approvals',{jobId,action:'jd_approval',requestedBy:'recruiter'});setJdApproval(d)}catch(e){fail(e)}finally{setApprovalBusy(false)}}\n async function approveJd(){if(!jdApproval?.id)return;setApprovalBusy(true);setError('');try{const d=await control(`approvals/${jdApproval.id}/decision`,{status:'approved',actor:'recruiter',note:'JD reviewed and approved for sourcing'});setJdApproval(d);await source()}catch(e){fail(e)}finally{setApprovalBusy(false)}}\n async function source(){if(jdApproval?.status!=='approved'){setError('Approve the JD before sourcing candidates.');return}"""
          new=""" async function requestJdApproval(){if(!jobId)return;setApprovalBusy(true);setError('');try{const d=await control('approvals',{jobId,action:'jd_approval',requestedBy:'recruiter'});setJdApproval(d)}catch(e){fail(e)}finally{setApprovalBusy(false)}}\n useEffect(()=>{if(!jobId)return;control(`approvals?jobId=${encodeURIComponent(jobId)}`,undefined,'GET').then((d:any)=>{const latest=Array.isArray(d?.approvals)?d.approvals.find((x:any)=>x.action==='jd_approval'):null;if(latest)setJdApproval(latest)}).catch(()=>{})},[jobId]);\n async function approveJd(){if(!jdApproval?.id)return;setApprovalBusy(true);setError('');try{const d=await control(`approvals/${jdApproval.id}/decision`,{status:'approved',actor:'recruiter',note:'JD reviewed and approved for sourcing'});setJdApproval(d);await source(d)}catch(e){fail(e)}finally{setApprovalBusy(false)}}\n async function source(approval?:any){if(approval?.status!=='approved'&&jdApproval?.status!=='approved'){setError('Approve the JD before sourcing candidates.');return}"""
          if old not in s: raise SystemExit('HiringLifecycle patch target not found')
          p.write_text(s.replace(old,new))

          p=Path('components/LandingPageFinal.tsx')
          s=p.read_text()
          old="const demo=()=>{setStage(0);setPaused(false);setOpen(true)};"
          new="const demo=()=>{document.getElementById('magic-demo')?.scrollIntoView({behavior:'smooth'});};"
          if old not in s: raise SystemExit('Landing demo target not found')
          s=s.replace(old,new)
          old2="onClick={()=>{setStage(i);setOpen(true)}}"
          new2="onClick={()=>{document.getElementById('magic-demo')?.scrollIntoView({behavior:'smooth'});}}"
          if old2 not in s: raise SystemExit('Landing stage demo target not found')
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
          rm -f .github/workflows/one-off-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/HiringLifecycleV2.tsx components/LandingPageFinal.tsx .github/workflows/one-off-repair.yml
          git commit -m 'fix: repair JD approval transition and screen demo entry' || exit 0
          git push
