name: SmartScout Candidate Score Regressions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-score-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Candidate score CI coverage regression
        run: node tests/candidate-score-ci-coverage-regression.mjs
      - name: Candidate score no-op audit regression
        run: node tests/candidate-lifecycle-score-noop-regression.mjs
      - name: Candidate score size boundary regression
        run: node tests/candidate-lifecycle-score-size-boundary-regression.mjs
      - name: Candidate score input boundary regression
        run: node tests/candidate-lifecycle-score-input-boundary-regression.mjs
      - name: Candidate score tenant guard regression
        run: node tests/candidate-lifecycle-score-tenant-guard-regression.mjs
