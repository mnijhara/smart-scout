name: Brand Accessibility Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: brand-accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brand-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run brand accessibility regression
        run: node tests/brand-accessibility-regression.mjs
