name: Control Plane Tenant Boundary Regression

on:
  push:
    branches: [main]
    paths:
      - 'services/recruiting/controlPlane.ts'
      - 'tests/control-plane-tenant-boundary-regression.mjs'
      - '.github/workflows/control-plane-tenant-boundary-regression.yml'
  pull_request:
    paths:
      - 'services/recruiting/controlPlane.ts'
      - 'tests/control-plane-tenant-boundary-regression.mjs'
      - '.github/workflows/control-plane-tenant-boundary-regression.yml'

permissions:
  contents: read

jobs:
  tenant-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/control-plane-tenant-boundary-regression.mjs
