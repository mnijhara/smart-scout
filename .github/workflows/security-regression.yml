name: Security Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node tests/security-regression.mjs
      - run: node tests/tenant-isolation-regression.mjs
      - run: node tests/rate-limit-regression.mjs
      - run: node tests/provider-configuration-regression.mjs
      - run: node tests/hiring-audit-regression.mjs
      - run: node tests/hiring-audit-durability-regression.mjs
