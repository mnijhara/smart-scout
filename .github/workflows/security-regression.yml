name: Security Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/security-regression.mjs
