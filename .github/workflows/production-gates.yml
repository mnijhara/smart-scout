name: SmartScout Production Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  production-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type validation
        run: npm run lint
      - name: Migration safety
        run: npm run verify:migrations
      - name: Vite production build
        run: npm run build
      - name: Server production bundle
        run: npm run build:server
      - name: Public E2E
        run: npm run e2e:public
      - name: Verify release artifacts
        run: |
          test -d dist
          test -f server.js
          test -f package.json
