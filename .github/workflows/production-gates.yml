name: SmartScout Production Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smartscout-production-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMARTSCOUT_SESSION_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type validation
        run: npm run lint
      - name: Security regression
        run: node tests/security-regression.mjs
      - name: Guest session expiry regression
        run: npx tsx tests/guest-session-expiry-regression.mjs
      - name: Workspace cookie parser regression
        run: npx tsx tests/workspace-cookie-parser-regression.mjs
      - name: Workspace tenant header regression
        run: npx tsx tests/workspace-tenant-header-regression.mjs
      - name: Workspace identity authority regression
        run: npx tsx tests/workspace-identity-authority-regression.mjs
      - name: AI credential workspace isolation regression
        run: node tests/ai-credential-workspace-regression.mjs
      - name: Provider configuration regression
        run: node tests/provider-configuration-regression.mjs
      - name: Provider configuration state regression
        run: node tests/provider-configuration-state-regression.mjs
      - name: Migration safety
        run: npm run verify:migrations
      - name: Migration verifier hiring-state integrity regression
        run: node tests/migration-verifier-hiring-state-integrity-regression.mjs
      - name: Migration readiness regression
        run: node tests/migration-readiness-regression.mjs
      - name: Recruiting core RLS migration order regression
        run: node tests/recruiting-core-rls-migration-order-regression.mjs
      - name: Recruiting core RLS regression
        run: node tests/recruiting-core-rls-regression.mjs
      - name: Tenant isolation regression
        run: npm run e2e:tenant-isolation
      - name: Hiring state isolation regression
        run: node tests/hiring-state-isolation-regression.mjs
      - name: Hiring state persistence and audit regression
        run: npx tsx tests/hiring-state-audit-regression.mjs
      - name: Hiring state query identity regression
        run: npx tsx tests/hiring-state-query-identity-regression.mjs
      - name: Hiring state candidate identity regression
        run: npx tsx tests/hiring-state-candidate-identity-regression.mjs
      - name: Hiring state payload boundary regression
        run: npx tsx tests/hiring-state-payload-boundary-regression.mjs
      - name: Hiring state database storage bounds regression
        run: node tests/hiring-state-storage-bounds-regression.mjs
      - name: Hiring state identity storage bounds regression
        run: node tests/hiring-state-identity-storage-bounds-regression.mjs
      - name: Hiring state corruption regression
        run: node tests/hiring-state-corruption-regression.mjs
      - name: Hiring state read bounds regression
        run: node tests/hiring-state-read-bounds-regression.mjs
      - name: Candidate score write serialization regression
        run: npx tsx tests/candidate-score-write-serialization-regression.mjs
      - name: Store tenant identity regression
        run: npx tsx tests/store-tenant-identity-regression.mjs
      - name: Interview state machine regression
        run: npx tsx tests/interview-state-machine-regression.mjs
      - name: Interview timestamp validation regression
        run: npx tsx tests/interview-window-validation-regression.mjs
      - name: Interview audit actor regression
        run: npx tsx tests/interview-audit-actor-regression.mjs
      - name: Interview identity regression
        run: npx tsx tests/interview-identity-regression.mjs
      - name: Interview answer boundary regression
        run: npx tsx tests/interview-answer-boundary-regression.mjs
      - name: Interview schedule input regression
        run: npx tsx tests/interview-schedule-input-regression.mjs
      - name: Interview schedule tenant isolation regression
        run: npx tsx tests/interview-schedule-tenant-isolation-regression.mjs
      - name: Audit persistence count regression
        run: node tests/audit-persistence-count-regression.mjs
      - name: Audit identity validation regression
        run: node tests/audit-identity-validation-regression.mjs
      - name: Audit identity normalization regression
        run: node tests/audit-identity-normalization-regression.mjs
      - name: Audit workflow identity regression
        run: npx tsx tests/audit-workflow-identity-regression.mjs
      - name: Audit candidate identity regression
        run: npx tsx tests/audit-candidate-identity-regression.mjs
      - name: Audit candidate query regression
        run: npx tsx tests/audit-candidate-query-regression.mjs
      - name: Audit actor identity regression
        run: node tests/audit-actor-identity-regression.mjs
      - name: Audit optional identity boundary regression
        run: npx tsx tests/audit-optional-identity-boundary-regression.mjs
      - name: Audit tenant boundary regression
        run: node tests/audit-tenant-boundary-regression.mjs
      - name: Audit payload boundary regression
        run: node tests/audit-payload-boundary-regression.mjs
      - name: Audit evidence boundary regression
        run: node tests/audit-evidence-boundary-regression.mjs
      - name: Audit event type boundary regression
        run: node tests/audit-event-type-boundary-regression.mjs
      - name: Audit storage bounds regression
        run: node tests/audit-storage-bounds-regression.mjs
      - name: Audit query indexes regression
        run: node tests/audit-query-indexes-regression.mjs
      - name: Audit query identity normalization regression
        run: node tests/audit-query-identity-normalization-regression.mjs
      - name: Audit lifecycle regression
        run: npm run e2e:audit-lifecycle
      - name: Audit durability regression
        run: node tests/hiring-audit-durability-regression.mjs
      - name: Control-plane identity boundary regression
        run: npx tsx tests/control-plane-identity-boundary-regression.mjs
      - name: Control-plane audit lifecycle regression
        run: npx tsx tests/control-plane-audit-regression.mjs
      - name: Control-plane candidate audit query regression
        run: npx tsx tests/control-plane-audit-candidate-query-regression.mjs
      - name: Rate-limit production regression
        run: node tests/rate-limit-production-regression.mjs
      - name: Vite production build
        run: npm run build
      - name: Server production bundle
        run: npm run build:server
      - name: Verify release identity
        run: npm run verify:release
      - name: Production runtime and Chromium E2E
        run: |
          set -euo pipefail
          export NODE_ENV=production
          export PORT=3000
          export SMARTSCOUT_VAULT_KEY="$(openssl rand -hex 32)"
          node server.cjs > /tmp/smartscout-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/recruiting/health >/dev/null; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:3000/api/recruiting/health >/dev/null; then cat /tmp/smartscout-server.log; exit 1; fi
          curl -fsS -c /tmp/cookies.txt http://127.0.0.1:3000/api/recruiting/session > /tmp/session.json
          grep -q '\"ok\":true' /tmp/session.json
          test -s /tmp/cookies.txt
          for endpoint in /api/recruiting/jobs /api/recruiting/integrations/health; do
            status=$(curl -sS -b /tmp/cookies.txt -o /tmp/protected.json -w '%{http_code}' "http://127.0.0.1:3000${endpoint}")
            test "$status" = "200"
          done
          for endpoint in /api/control-plane/usage /api/control-plane/approvals /api/control-plane/schedules; do
            status=$(curl -sS -b /tmp/cookies.txt -o /tmp/control-plane.json -w '%{http_code}' "http://127.0.0.1:3000${endpoint}")
            test "$status" = "401"
          done
          status=$(curl -sS -o /tmp/unauthenticated.json -w '%{http_code}' http://127.0.0.1:3000/api/recruiting/jobs)
          test "$status" = "401"
          status=$(curl -sS -o /tmp/duplicate-browser.json -w '%{http_code}' -b /tmp/cookies.txt -H 'Content-Type: application/json' -d '{"source":"linkedin","query":"software engineer"}' http://127.0.0.1:3000/api/recruiting/browser-source/search)
          test "$status" = "400"
          curl -fsS -b /tmp/cookies.txt -H 'Content-Type: application/json' -d '{"candidate":{"id":"smoke-candidate","name":"Test Candidate","source":"smoke","resumeText":"5 years JavaScript React Node.js experience"},"requirement":{"title":"Software Engineer","description":"","mustHave":["JavaScript","React"],"niceToHave":[],"experienceMin":3}}' http://127.0.0.1:3000/api/recruiting/candidate/knockout > /tmp/knockout.json
          grep -q '\"passed\":true' /tmp/knockout.json
          SMARTSCOUT_BASE_URL=http://127.0.0.1:3000 npm run e2e:runtime-security
          SMARTSCOUT_BASE_URL=http://127.0.0.1:3000 npm run e2e:public
          node tests/accessibility-regression.mjs
      - name: Verify release artifacts
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/release.json
          test -f server.js
          test -f server.cjs
          test -f package.json
          test "$(node -e "console.log(require('./dist/release.json').commit)")" = "$GITHUB_SHA"
      - name: Verify live release identity (external, non-blocking)
        continue-on-error: true
        env:
          LIVE_URL: https://smartscout.online/
        run: |
          set +e
          LIVE_HTTP_CODE=$(curl -sS -o /tmp/smartscout-live.html -w '%{http_code}' --retry 3 --retry-delay 2 --retry-all-errors --max-time 20 "$LIVE_URL")
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ]; then echo "WARNING: live release verification could not reach $LIVE_URL (curl exit $CURL_EXIT)"; cat /tmp/smartscout-live.html 2>/dev/null || true; exit 1; fi
          if [ "$LIVE_HTTP_CODE" != "200" ]; then echo "WARNING: live release verification blocked: $LIVE_URL returned HTTP $LIVE_HTTP_CODE"; cat /tmp/smartscout-live.html || true; exit 1; fi
          LIVE_MARKER=$(sed -n 's/.*smart-scout-release[^>]*content="\([^"]*\)".*/\1/p' /tmp/smartscout-live.html | head -n 1)
          LIVE_SHA=$(curl -fsS --max-time 10 "$LIVE_URL/release.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).commit))")
          test "$LIVE_MARKER" = "$GITHUB_SHA"
          test "$LIVE_SHA" = "$GITHUB_SHA"
          echo "Live SmartScout release verified: $GITHUB_SHA"
