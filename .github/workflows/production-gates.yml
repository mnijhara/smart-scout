name: SmartScout Production Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  production-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type validation
        run: npm run lint
      - name: Security regression
        run: node tests/security-regression.mjs
      - name: Guest session expiry regression
        run: npx tsx tests/guest-session-expiry-regression.mjs
      - name: Workspace tenant header regression
        run: npx tsx tests/workspace-tenant-header-regression.mjs
      - name: Workspace identity authority regression
        run: npx tsx tests/workspace-identity-authority-regression.mjs
      - name: AI credential workspace isolation regression
        run: node tests/ai-credential-workspace-regression.mjs
      - name: Provider configuration regression
        run: node tests/provider-configuration-regression.mjs
      - name: Migration safety
        run: npm run verify:migrations
      - name: Migration readiness regression
        run: node tests/migration-readiness-regression.mjs
      - name: Tenant isolation regression
        run: npm run e2e:tenant-isolation
      - name: Hiring state isolation regression
        run: node tests/hiring-state-isolation-regression.mjs
      - name: Hiring state persistence and audit regression
        run: npx tsx tests/hiring-state-audit-regression.mjs
      - name: Hiring state query identity regression
        run: npx tsx tests/hiring-state-query-identity-regression.mjs
      - name: Hiring state candidate identity regression
        run: npx tsx tests/hiring-state-candidate-identity-regression.mjs
      - name: Hiring state payload boundary regression
        run: npx tsx tests/hiring-state-payload-boundary-regression.mjs
      - name: Candidate score write serialization regression
        run: npx tsx tests/candidate-score-write-serialization-regression.mjs
      - name: Store tenant identity regression
        run: npx tsx tests/store-tenant-identity-regression.mjs
      - name: Interview state machine regression
        run: node tests/interview-state-machine-regression.mjs
      - name: Interview timestamp validation regression
        run: npx tsx tests/interview-window-validation-regression.mjs
      - name: Interview audit actor regression
        run: node tests/interview-audit-actor-regression.mjs
      - name: Interview identity regression
        run: npx tsx tests/interview-identity-regression.mjs
      - name: Interview answer boundary regression
        run: npx tsx tests/interview-answer-boundary-regression.mjs
      - name: Interview schedule input regression
        run: npx tsx tests/interview-schedule-input-regression.mjs
      - name: Audit persistence count regression
        run: node tests/audit-persistence-count-regression.mjs
      - name: Audit identity validation regression
        run: node tests/audit-identity-validation-regression.mjs
      - name: Audit identity normalization regression
        run: node tests/audit-identity-normalization-regression.mjs
      - name: Audit workflow identity regression
        run: npx tsx tests/audit-workflow-identity-regression.mjs
      - name: Audit candidate identity regression
        run: npx tsx tests/audit-candidate-identity-regression.mjs
      - name: Audit actor identity regression
        run: node tests/audit-actor-identity-regression.mjs
      - name: Audit payload boundary regression
        run: node tests/audit-payload-boundary-regression.mjs
      - name: Audit evidence boundary regression
        run: node tests/audit-evidence-boundary-regression.mjs
      - name: Audit event type boundary regression
        run: node tests/audit-event-type-boundary-regression.mjs
      - name: Audit lifecycle regression
        run: npm run e2e:audit-lifecycle
      - name: Audit durability regression
        run: node tests/hiring-audit-durability-regression.mjs
      - name: Control-plane identity boundary regression
        run: npx tsx tests/control-plane-identity-boundary-regression.mjs
      - name: Rate-limit production regression
        run: node tests/rate-limit-production-regression.mjs
      - name: Vite production build
        run: npm run build
      - name: Server production bundle
        run: npm run build:server
      - name: Verify release identity
        run: npm run verify:release
      - name: Start production server
        run: |
          export NODE_ENV=production
          export PORT=3000
          export SMARTSCOUT_VAULT_KEY="$(openssl rand -hex 32)"
          node server.cjs > /tmp/smartscout-server.log 2>&1 &
          echo $! > /tmp/smartscout-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/recruiting/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/smartscout-server.log
          exit 1
      - name: Runtime authentication boundary E2E
        run: npm run e2e:runtime-security
      - name: Public E2E
        run: npm run e2e:public
      - name: Mobile accessibility regression
        run: node tests/accessibility-regression.mjs
      - name: Verify release artifacts
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/release.json
          test -f server.js
          test -f server.cjs
          test -f package.json
          test "$(node -e "console.log(require('./dist/release.json').commit)")" = "$GITHUB_SHA"
      - name: Verify live release identity
        env:
          LIVE_URL: https://smartscout.online/
        run: |
          set +e
          LIVE_HTTP_CODE=$(curl -sS -o /tmp/smartscout-live.html -w '%{http_code}' --retry 3 --retry-delay 2 --retry-all-errors --max-time 20 "$LIVE_URL")
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "Live release verification could not reach $LIVE_URL (curl exit $CURL_EXIT)"
            cat /tmp/smartscout-live.html 2>/dev/null || true
            exit 1
          fi
          if [ "$LIVE_HTTP_CODE" != "200" ]; then
            echo "Live release verification blocked: $LIVE_URL returned HTTP $LIVE_HTTP_CODE"
            cat /tmp/smartscout-live.html || true
            exit 1
          fi
          LIVE_MARKER=$(sed -n 's/.*smart-scout-release[^>]*content="\([^"]*\)".*/\1/p' /tmp/smartscout-live.html | head -n 1)
          LIVE_SHA=$(curl -fsS --max-time 10 "$LIVE_URL/release.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).commit))")
          test "$LIVE_MARKER" = "$GITHUB_SHA"
          test "$LIVE_SHA" = "$GITHUB_SHA"
          echo "Live SmartScout release verified: $GITHUB_SHA"
