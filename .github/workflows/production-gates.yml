name: SmartScout Production Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  production-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type validation
        run: npm run lint
      - name: Migration safety
        run: npm run verify:migrations
      - name: Vite production build
        run: npm run build
      - name: Server production bundle
        run: npm run build:server
      - name: Start production server
        run: |
          NODE_ENV=production PORT=3000 node server.js > /tmp/smartscout-server.log 2>&1 &
          echo $! > /tmp/smartscout-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/recruiting/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/smartscout-server.log
          exit 1
      - name: Runtime authentication boundary E2E
        run: npm run e2e:runtime-security
      - name: Public E2E
        run: npm run e2e:public
      - name: Verify release artifacts
        run: |
          test -d dist
          test -f server.js
          test -f package.json
