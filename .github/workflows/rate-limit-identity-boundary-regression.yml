name: Rate limit identity boundary regression

on:
  push:
    branches: [main]
    paths:
      - 'services/recruiting/rateLimitMiddleware.ts'
      - 'tests/rate-limit-identity-boundary-regression.mjs'
      - '.github/workflows/rate-limit-identity-boundary-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rate-limit-identity-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/rate-limit-identity-boundary-regression.mjs
