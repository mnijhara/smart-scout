name: Interview Persistence Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  interview-persistence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run interview persistence regression checks
        run: node tests/interview-persistence-regression.mjs
