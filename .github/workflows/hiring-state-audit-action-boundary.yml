name: Hiring State Audit Action Boundary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify hiring-state audit action boundary
        run: node tests/hiring-state-rpc-audit-action-boundary-regression.mjs
