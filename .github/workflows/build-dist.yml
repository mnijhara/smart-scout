name: Build production frontend and server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Build Vite frontend
        run: npm run build

      - name: Build production Node server
        run: npx esbuild server.ts --bundle --platform=node --format=esm --outfile=server.js --packages=external

      - name: Apply production Gemini compatibility
        run: |
          # The current gateway uses generateContent with sampling parameters;
          # normalize the UI/backend model selection to the stable model for this build.
          sed -i 's/gemini-3\.6-flash/gemini-2.5-flash/g' server.js
          find dist -type f -name '*.js' -print0 | xargs -0 sed -i 's/gemini-3\.6-flash/gemini-2.5-flash/g'

      - name: Verify production build
        run: |
          test -f dist/index.html
          test -f server.js
          node --check server.js
          if grep -Eq '^import .*services/recruiting/api(\.js)?([[:space:]]|[\"'\'';])' server.js; then
            echo "ERROR: production server.js still contains an external recruiting API import"
            exit 1
          fi
          if ! grep -q "recruiting-os" server.js; then
            echo "ERROR: recruiting API was not bundled into production server.js"
            exit 1
          fi
          if grep -R -q "gemini-3.6-flash" server.js dist --include='*.js'; then
            echo "ERROR: unsupported production Gemini model reference remains"
            exit 1
          fi

      - name: Smoke test production APIs
        run: |
          PORT=4173 NODE_ENV=production node server.js > /tmp/smartscout-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/api/recruiting/health > /tmp/recruiting-health.json; then break; fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/recruiting-health.json
          curl -fsS -H 'x-tenant-id: ci-smoke' http://127.0.0.1:4173/api/recruiting/jobs > /tmp/jobs.json
          grep -q '"jobs"' /tmp/jobs.json
          curl -fsS -H 'x-tenant-id: ci-smoke' http://127.0.0.1:4173/api/control-plane/usage > /tmp/usage.json
          grep -q '"usage"' /tmp/usage.json
          curl -fsS -H 'x-tenant-id: ci-smoke' http://127.0.0.1:4173/api/control-plane/approvals > /tmp/approvals.json
          grep -q '"approvals"' /tmp/approvals.json
          curl -fsS -H 'x-tenant-id: ci-smoke' http://127.0.0.1:4173/api/control-plane/schedules > /tmp/schedules.json
          grep -q '"schedules"' /tmp/schedules.json

      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist server.js
          if git diff --cached --quiet; then
            echo "production build is already up to date"
            exit 0
          fi
          git commit -m "chore: update production build [skip ci]"
          git push
