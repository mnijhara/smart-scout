name: Build production frontend and server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Build Vite frontend
        run: npm run build

      - name: Build production Node server
        run: npx esbuild server.ts --bundle --platform=node --format=esm --outfile=server.js --packages=external

      - name: Verify production build
        run: |
          test -f dist/index.html
          test -f server.js
          node --check server.js
          if grep -q "services/recruiting/api" server.js; then
            echo "ERROR: production server.js still contains an external recruiting API import"
            exit 1
          fi
          if ! grep -q "recruiting-os" server.js; then
            echo "ERROR: recruiting API was not bundled into production server.js"
            exit 1
          fi

      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist server.js
          if git diff --cached --quiet; then
            echo "production build is already up to date"
            exit 0
          fi
          git commit -m "chore: update production build [skip ci]"
          git push
