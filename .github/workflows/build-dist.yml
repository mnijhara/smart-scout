name: Build production frontend and server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Build Vite frontend
        run: npm run build

      - name: Build production Node server
        run: npx esbuild server.ts --bundle --platform=node --format=esm --outfile=server.js --packages=external

      - name: Verify production build
        run: |
          test -f dist/index.html
          test -f server.js
          node --check server.js
          if grep -Eq '^import .*services/recruiting/api(\.js)?([[:space:]]|[\"'\'';])' server.js; then
            echo "ERROR: production server.js still contains an external recruiting API import"
            exit 1
          fi
          if ! grep -q "recruiting-os" server.js; then
            echo "ERROR: recruiting API was not bundled into production server.js"
            exit 1
          fi
          echo "Production artifact verification passed for commit ${GITHUB_SHA}"

      - name: Smoke test production APIs
        run: |
          PORT=4173 NODE_ENV=production node server.js > /tmp/smartscout-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/api/recruiting/health > /tmp/recruiting-health.json; then break; fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/recruiting-health.json

          # Recruiting OS now supports a signed private browser workspace when
          # Firebase signup is unavailable. Establish that workspace first and
          # reuse its HttpOnly cookie for protected API smoke tests.
          curl -fsS -c /tmp/smartscout-cookies.txt http://127.0.0.1:4173/api/recruiting/session > /tmp/session.json
          grep -q '"ok":true' /tmp/session.json
          test -s /tmp/smartscout-cookies.txt

          for endpoint in \
            /api/recruiting/jobs \
            /api/control-plane/usage \
            /api/control-plane/approvals \
            /api/control-plane/schedules; do
            status=$(curl -sS -b /tmp/smartscout-cookies.txt -o /tmp/protected.json -w '%{http_code}' "http://127.0.0.1:4173${endpoint}")
            test "$status" = "200"
          done

      - name: Upload verified production artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartscout-production-${{ github.sha }}
          path: |
            dist
            server.js
            package.json
            node_modules
          if-no-files-found: error
          retention-days: 14
