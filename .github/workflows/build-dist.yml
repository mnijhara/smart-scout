name: Build production frontend and server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium into production artifact
        run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium
      - name: Typecheck
        run: npm run lint
      - name: Build Vite frontend
        run: npm run build
      - name: Build production Node server
        run: npx esbuild server.ts --bundle --platform=node --format=esm --outfile=server.js --packages=external
      - name: Verify production build
        run: |
          test -f dist/index.html
          test -f server.js
          test -f server.cjs
          test -d node_modules/playwright
          node --check server.js
          node --check server.cjs
          if grep -Eq '^import .*services/recruiting/api(\.js)?([[:space:]]|[\"'\'';])' server.js; then echo "ERROR: production server.js still contains an external recruiting API import"; exit 1; fi
          if ! grep -q "recruiting-os" server.js; then echo "ERROR: recruiting API was not bundled into production server.js"; exit 1; fi
          if ! grep -q "integrations/health" server.js; then echo "ERROR: production integration health endpoint was not bundled"; exit 1; fi
          if ! grep -q "candidate/knockout" server.js; then echo "ERROR: production knockout engine was not bundled"; exit 1; fi
          if ! grep -q "browser-sourcing/search" server.js; then echo "ERROR: Playwright browser sourcing was not bundled"; exit 1; fi
          echo "Production artifact verification passed for commit ${GITHUB_SHA}"
      - name: Smoke test production APIs
        run: |
          PORT=4173 NODE_ENV=production PLAYWRIGHT_BROWSERS_PATH=0 node server.cjs > /tmp/smartscout-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/api/recruiting/health > /tmp/recruiting-health.json; then break; fi; sleep 1; done
          grep -q '"ok":true' /tmp/recruiting-health.json
          curl -fsS -c /tmp/smartscout-cookies.txt http://127.0.0.1:4173/api/recruiting/session > /tmp/session.json
          grep -q '"ok":true' /tmp/session.json
          test -s /tmp/smartscout-cookies.txt
          for endpoint in /api/recruiting/jobs /api/recruiting/integrations/health /api/control-plane/usage /api/control-plane/approvals /api/control-plane/schedules; do status=$(curl -sS -b /tmp/smartscout-cookies.txt -o /tmp/protected.json -w '%{http_code}' "http://127.0.0.1:4173${endpoint}"); test "$status" = "200"; done
          curl -fsS -b /tmp/smartscout-cookies.txt -H 'Content-Type: application/json' -d '{"candidate":{"id":"smoke-candidate","name":"Test Candidate","source":"smoke","resumeText":"5 years JavaScript React Node.js experience"},"requirement":{"title":"Software Engineer","description":"","mustHave":["JavaScript","React"],"niceToHave":[],"experienceMin":3}}' http://127.0.0.1:4173/api/recruiting/candidate/knockout > /tmp/knockout.json
          grep -q '"passed":true' /tmp/knockout.json
          curl -fsS -b /tmp/smartscout-cookies.txt -H 'Content-Type: application/json' -d '{"candidates":[{"id":"a","name":"A","source":"smoke","resumeText":"JavaScript React","score":{"overall":90,"experience":90,"skills":90,"roleFit":90,"leadership":50,"strengths":["React"],"concerns":[],"evidence":[],"recommendation":"strong_yes"}},{"id":"b","name":"B","source":"smoke","resumeText":"JavaScript","score":{"overall":70,"experience":70,"skills":70,"roleFit":70,"leadership":50,"strengths":[],"concerns":[],"evidence":[],"recommendation":"maybe"}}],"requirement":{"title":"Software Engineer","description":"","mustHave":["JavaScript"],"niceToHave":[]}}' http://127.0.0.1:4173/api/recruiting/candidates/compare > /tmp/comparison.json
          grep -q '"rank":1' /tmp/comparison.json
      - name: Upload verified production artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartscout-production-${{ github.sha }}
          path: |
            dist
            server.js
            server.cjs
            package.json
            node_modules
          if-no-files-found: error
          retention-days: 14
